<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アミノ酸配列チェック</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>アミノ酸配列チェック</h1>
      <p class="description">アミノ酸配列を入力して、α鎖またはβ鎖を選んでから「判定する」ボタンを押してください。小文字や空白、改行を含んでいても判定できます。</p>

      <label class="field-label" for="chainSelect">判定対象</label>
      <select id="chainSelect" class="chain-select">
        <option value="alpha">α鎖</option>
        <option value="beta">β鎖</option>
      </select>

      <label class="field-label" for="sequenceInput">アミノ酸配列</label>
      <textarea id="sequenceInput" class="sequence-input" rows="6" placeholder="例: MKTAYIAKQRQIFVKSHFSRQDILDLWIY"></textarea>

      <button id="checkButton" type="button" class="check-button">判定する</button>

      <div id="resultArea" class="result result-placeholder" aria-live="polite">ここに結果が表示されます</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
